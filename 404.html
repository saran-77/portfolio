<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Shiva Saran</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080B14">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080B14'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='monospace' font-size='28' font-weight='700' fill='%2333D9E0'%3ESS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080B14;--violet:#8B6BF2;--cyan:#33D9E0;--amber:#F0A85A;--text:#E9ECF6;--text-dim:#8891AC;--line:rgba(139,107,242,0.16);}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;padding:24px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
}
.wrap{width:100%;max-width:520px;}
.code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(72px,16vw,120px);line-height:1;letter-spacing:-3px;}
.code span{color:var(--cyan);}
.term{
  margin:28px 0 32px;border:1.5px solid rgba(51,217,224,0.6);border-radius:12px;overflow:hidden;
  background:rgba(8,11,20,0.95);font-size:13px;line-height:1.7;
}
.bar{display:flex;gap:7px;padding:11px 14px;background:rgba(28,34,54,0.95);border-bottom:1px solid var(--line);}
.bar i{width:11px;height:11px;border-radius:50%;display:block;}
.bar i:nth-child(1){background:#FF5F57;}.bar i:nth-child(2){background:#FEBC2E;}.bar i:nth-child(3){background:#28C840;}
.body{padding:14px 16px;color:var(--text-dim);}
.body .p{color:var(--cyan);}.body .path{color:var(--violet);}.body .warn{color:var(--amber);}
a.home{
  display:inline-flex;padding:14px 28px;border-radius:999px;background:var(--text);color:var(--bg);
  text-decoration:none;font-size:13px;transition:background .3s,color .3s,transform .3s;
}
a.home:hover{background:var(--violet);color:#fff;transform:translateY(-3px);}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="code">404<span>.</span></h1>
  <div class="term" role="img" aria-label="Terminal: page not found">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body">
      <div><span class="p">➜</span> <span class="path">~</span> <span id="req">cd /this-page</span></div>
      <div class="warn">zsh: page not found</div>
      <div>The link may be broken or the page was moved.</div>
    </div>
  </div>
  <a class="home" href="/">Back to home →</a>
</main>
<script>
document.getElementById('req').textContent = 'cd ' + location.pathname;
</script>
</body>
</html>
